name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # ubuntu-latest is x86_64 (scalar or avx-512 depending on the runner CPU);
    # macos-latest is Apple Silicon, which exercises the NEON kernels.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Kernel microbenchmark (smoke run)
        run: cargo run --release --bin lodestone-kernels

      # Retracted-claim guard. The readme once said "a 30-48x speedup over the exact scan at 90%+ recall".
      - name: Retracted claims must not return
        run: |
          if grep -rniE '3[[:space:]]*0[[:space:]]*[-–—][[:space:]]*4[[:space:]]*8[[:space:]]*[x×]|30[[:space:]]*to[[:space:]]*48[[:space:]]*[x×]|31,?700' \
               --include='*.md' --include='*.rs' --include='*.toml' . ; then
            echo "::error::A retracted benchmark claim is back. See benchmarks/raw/bench_50k_128d.txt: the >=0.90 recall band is 9.2x-32.8x and the QPS figure is ~31,800."
            exit 1
          fi
          echo "No retracted claims found."
